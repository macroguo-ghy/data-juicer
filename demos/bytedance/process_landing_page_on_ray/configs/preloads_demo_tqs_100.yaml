project_name: "landing-page-preloads-tqs-100-ray"
executor_type: "ray"
ray_address: "auto"
min_common_dep_num_to_combine: 0

dataset:
  configs:
    - type: remote
      source: tqs
      read_mode: "client_result"
      max_result_rows: 1000
      tqs_app_id: "<YOUR_TQS_APP_ID>"
      tqs_app_key: "<YOUR_TQS_APP_KEY>"
      user_name: "guohongyu.7"
      tqs_cluster: "cn"
      tqs_timeout: 120
      query: |
        SELECT
          CAST(p_date AS STRING) AS p_date,
          CAST(site_id AS BIGINT) AS site_id,
          CAST(local_stat_time_day AS STRING) AS local_stat_time_day,
          CAST(external_url AS STRING) AS external_url,
          CAST(thumbnail AS STRING) AS thumbnail,
          CAST(preload_resources AS STRING) AS preload_resources,
          CAST(page_public_data AS STRING) AS page_public_data,
          CAST(site_type AS BIGINT) AS site_type,
          CAST(is_highlight AS BIGINT) AS is_highlight,
          CAST(cost AS BIGINT) AS cost,
          CAST(send_count AS BIGINT) AS send_count,
          CAST(show_count AS BIGINT) AS show_count,
          CAST(click_count AS BIGINT) AS click_count,
          CAST(convert_count AS BIGINT) AS convert_count,
          CAST(ad_id AS BIGINT) AS ad_id,
          CAST(campaign_id AS BIGINT) AS campaign_id,
          CAST(advertiser_id AS BIGINT) AS advertiser_id,
          CAST(customer_id AS BIGINT) AS customer_id,
          CAST(company_id AS BIGINT) AS company_id,
          CAST(first_industry_id AS BIGINT) AS first_industry_id,
          CAST(first_industry_name AS STRING) AS first_industry_name,
          CAST(second_industry_id AS BIGINT) AS second_industry_id,
          CAST(second_industry_name AS STRING) AS second_industry_name,
          CAST(third_industry_id AS BIGINT) AS third_industry_id,
          CAST(ad_first_industry_id AS BIGINT) AS ad_first_industry_id,
          CAST(ad_first_industry_name AS STRING) AS ad_first_industry_name,
          CAST(ad_second_industry_id AS BIGINT) AS ad_second_industry_id,
          CAST(ad_second_industry_name AS STRING) AS ad_second_industry_name,
          CAST(ad_third_industry_id AS BIGINT) AS ad_third_industry_id,
          CAST(ad_third_industry_name AS STRING) AS ad_third_industry_name
        FROM ad_addrd_stats.site_creative_center_df_stats_daily_sample_v2_chengzi
        WHERE p_date = '20260423'
          AND preload_resources is not null and preload_resources != '[]'

export:
  target: "magnus"
  table_name: "ai_data_forge.ccu.landing_page_chengzi"
  operation: "OVERWRITE"
  create_table_if_not_exists: true
  partition_columns: ["p_date"]
  partition_values:
    p_date: "20260423"
  schema:
    fields:
      - {name: "id", type: "string"}
      - {name: "source", type: "string"}
      - {name: "texts", type: "list<string>"}
      - {name: "images", type: "list<binary>"}
      - {name: "audios", type: "list<binary>"}
      - {name: "videos", type: "list<binary>"}
      - {name: "has_audio_in_video", type: "bool"}
      - {name: "type", type: "string"}
      - {name: "md5", type: "string"}
      - {name: "site_id", type: "int64"}
      - {name: "local_stat_time_day", type: "string"}
      - {name: "p_date", type: "string"}
      - {name: "external_url", type: "string"}
      - {name: "thumbnail", type: "string"}
      - {name: "page_public_data", type: "string"}
      - {name: "preload_resources", type: "string"}
      - {name: "site_type", type: "int64"}
      - {name: "is_highlight", type: "int64"}
      - {name: "cost", type: "int64"}
      - {name: "send_count", type: "int64"}
      - {name: "show_count", type: "int64"}
      - {name: "click_count", type: "int64"}
      - {name: "convert_count", type: "int64"}
      - {name: "ad_id", type: "int64"}
      - {name: "campaign_id", type: "int64"}
      - {name: "advertiser_id", type: "int64"}
      - {name: "customer_id", type: "int64"}
      - {name: "company_id", type: "int64"}
      - {name: "first_industry_id", type: "int64"}
      - {name: "first_industry_name", type: "string"}
      - {name: "second_industry_id", type: "int64"}
      - {name: "second_industry_name", type: "string"}
      - {name: "third_industry_id", type: "int64"}
      - {name: "ad_first_industry_id", type: "int64"}
      - {name: "ad_first_industry_name", type: "string"}
      - {name: "ad_second_industry_id", type: "int64"}
      - {name: "ad_second_industry_name", type: "string"}
      - {name: "ad_third_industry_id", type: "int64"}
      - {name: "ad_third_industry_name", type: "string"}
  magnus_conf:
    concurrency: 8
    ray_remote_args:
      num_cpus: 1
    write_options:
      write.format.default: "lance"
      magnus.ray.write.disable_repartition: "true"
      magnus.ray.write.disable_sort: "true"


project_name: "landing-page-thumbnail-hive-sample-1-1000-ray"
executor_type: "ray"
ray_address: "auto"
min_common_dep_num_to_combine: 0

dataset:
  configs:
    - type: remote
      source: hive
      table_name: "ad_addrd_stats.site_creative_center_df_stats_daily_sample_v2_chengzi"
      columns:
        - "p_date"
        - "site_id"
        - "local_stat_time_day"
        - "external_url"
        - "thumbnail"
      filter: |
        p_date = '20260421'
        AND thumbnail IS NOT NULL
        AND site_id % 1000 = 0
      override_num_blocks: 128
      concurrency: 64
      ray_remote_args:
        num_cpus: 1

export:
  target: "magnus"
  table_name: "ai_data_forge.ccu.landing_page_thumbnail_sample_1_1000"
  operation: "OVERWRITE"
  partition_columns: ["p_date"]
  partition_values:
    p_date: "20260421"
  schema:
    fields:
      - {name: "id", type: "string"}
      - {name: "source", type: "string"}
      - {name: "texts", type: "list<string>"}
      - {name: "images", type: "list<binary>"}
      - {name: "audios", type: "list<binary>"}
      - {name: "videos", type: "list<binary>"}
      - {name: "has_audio_in_video", type: "bool"}
      - {name: "type", type: "string"}
      - {name: "md5", type: "string"}
      - {name: "site_id", type: "int64"}
      - {name: "local_stat_time_day", type: "string"}
      - {name: "p_date", type: "string"}
  magnus_conf:
    concurrency: 8
    ray_remote_args:
      num_cpus: 1
    write_options:
      write.format.default: "lance"
      magnus.ray.write.disable_repartition: "true"
      magnus.ray.write.disable_sort: "true"

process:
  - landing_page_image_url_mapper:
      image_source: "thumbnail"
      id_field: "site_id"
      thumbnail_key: "thumbnail"
      batch_size: 5000
      num_proc: 16
  - download_file_mapper:
      download_field: "images"
      save_field: "image_bytes"
      timeout: 2
      retry_times: 3
      max_concurrent: 4
      filter_non_url: true
      batch_size: 100
      num_proc: 16
      num_cpus: 1
  - image_bytes_prune_mapper:
      image_key: "images"
      image_bytes_key: "image_bytes"
      valid_image_count_key: "valid_image_count"
      batch_size: 100
      num_proc: 16
      num_cpus: 1
  - specified_numeric_field_filter:
      field_key: "valid_image_count"
      min_value: 1
      batch_size: 100
      num_proc: 16
  - image_bytes_exact_dedup_mapper:
      image_key: "images"
      image_bytes_key: "image_bytes"
      md5_key: "md5"
      valid_image_count_key: "valid_image_count"
      batch_size: 100
      num_proc: 16
      num_cpus: 1
  - ray_document_deduplicator:
      text_key: "md5"
      lowercase: false
      ignore_non_character: false
      dedup_set_num: 8
      batch_size: 100
      num_proc: 8
  - landing_page_image_schema_finalize_mapper:
      image_bytes_key: "image_bytes"
      md5_key: "md5"
      passthrough_keys: ["site_id", "local_stat_time_day", "p_date"]
      passthrough_types:
        site_id: "int64"
        local_stat_time_day: "string"
        p_date: "string"
      batch_size: 100
      num_proc: 16

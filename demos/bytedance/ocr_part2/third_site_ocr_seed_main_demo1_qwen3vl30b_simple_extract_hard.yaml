project_name: "third-site-ocr-qwen3vl30b-simple-extract-hard-ray"
executor_type: "ray"
ray_address: "auto"
min_common_dep_num_to_combine: 0

dataset:
  configs:
    - type: remote
      source: magnus
      table_name: "ai_data_forge.ccu.third_site_ocr_seed_main_demo1"
      magnus_conf: {}

export:
  target: "magnus"
  table_name: "ai_data_forge.ccu.third_site_ocr_seed_main_demo1_qwen3vl30b_simple_extract_hard"
  operation: "OVERWRITE"
  partition_columns: ["p_date"]
  partition_values:
    p_date: "20260509"
  create_table_if_not_exists: true
  schema:
    fields:
      - name: "id"
        type: "string"
      - name: "extra"
        type: "string"
      - name: "images"
        type: "list<binary>"
      - name: "md5"
        type: "string"
      - name: "source"
        type: "string"
      - name: "texts"
        type: "list<string>"
      - name: "audios"
        type: "string"
      - name: "videos"
        type: "string"
      - name: "has_audio_in_video"
        type: "bool"
      - name: "type"
        type: "string"
      - name: "ocr_result"
        type: "string"
      - name: "image_index"
        type: "int64"
      - name: "text_richness_score"
        type: "float64"
      - name: "char_score"
        type: "float64"
      - name: "area_score"
        type: "float64"
      - name: "ocr_text"
        type: "list<string>"
      - name: "ocr_bbox"
        type: "list<list<float64>>"
      - name: "ocr_answer"
        type: "string"
      - name: "vlm_error"
        type: "string"
      - name: "ocr_type"
        type: "string"
      - name: "ocr_type_en"
        type: "string"
      - name: "qwen_prompt"
        type: "string"
      - name: "qwen_response"
        type: "string"
      - name: "qwen_response_text"
        type: "string"
      - name: "qwen_response_format"
        type: "string"
      - name: "qwen_postprocess_error"
        type: "string"
      - name: "messages"
        type: "list<struct<role:string,content:string>>"
      - name: "p_date"
        type: "string"
  magnus_conf:
    concurrency: 8
    ray_remote_args:
      num_cpus: 1
    write_options:
      write.format.default: "lance"
      magnus.ray.write.disable_repartition: "true"
      magnus.ray.write.disable_sort: "true"

process:
  - specified_field_filter:
      field_key: "ocr_type_en"
      target_value: ["simple_extract"]
      batch_size: 1000
      num_proc: 128
      num_cpus: 1
  - ray_random_sample_pipeline:
      select_num: 20000
      seed: 20260509
      num_cpus: 1
  - weighted_prompt_mapper:
      output_key: "qwen_prompt"
      hash_key: "id"
      seed: 20260509
      prompt_weights:
        - prompt: "output qwenvl html directly, with style"
          weight: 0.05
        - prompt: "output qwenvl html directly, ignore style, attribute with data-bbox"
          weight: 0.10
        - prompt: "output qwenvl html directly, ignore style, attribute without data-bbox"
          weight: 0.15
        - prompt: "output qwenvl csv directly"
          weight: 0.05
        - prompt: "output qwenvl yaml directly"
          weight: 0.10
        - prompt: "output qwenvl xml directly"
          weight: 0.10
        - prompt: "output qwenvl json directly, with all info"
          weight: 0.10
        - prompt: "output qwenvl json directly, with only text info"
          weight: 0.10
        - prompt: "output qwenvl markdown directly"
          weight: 0.25
      batch_size: 1000
      num_proc: 64
      num_cpus: 1
  - vlm_api_response_mapper:
      image_key: "images"
      output_key: "qwen_response"
      error_key: "vlm_error"
      prompt_template: "${qwen_prompt}"
      model: "qwen3vl"
      base_url: "http://[2605:340:cd51:603:7dd5:e521:38d0:fe5c]:8001/v1"
      temperature: 0.1
      max_tokens: 2048
      extra_body:
        top_p: 0.4
      timeout: 600
      rpm: 120
      tpm: 500000
      estimated_tokens_per_request: 4096
      image_token_divisor: 1764
      max_image_tokens: 5120
      image_tokens_per_image: 5120
      repartition_num_blocks: 160
      batch_size: 1
      num_proc: 32
      num_cpus: 1
  - qwen_ocr_response_to_swift_mapper:
      prompt_key: "qwen_prompt"
      response_key: "qwen_response"
      output_messages_key: "messages"
      output_response_text_key: "qwen_response_text"
      output_format_key: "qwen_response_format"
      error_key: "qwen_postprocess_error"
      batch_size: 100
      num_proc: 64
      num_cpus: 1
  - specified_field_filter:
      field_key: "qwen_postprocess_error"
      target_value: [""]
      batch_size: 1000
      num_proc: 64
      num_cpus: 1
  - ray_field_deduplicator:
      field_key: "images"
      batch_size: 1000
      num_cpus: 1
  - character_repetition_filter:
      text_key: "qwen_response_text"
      rep_len: 10
      min_ratio: 0.0
      max_ratio: 0.5
      batch_size: 1000
      num_proc: 64
      num_cpus: 1

# 电商视频-VideoArch URL 缺失诊断
project_name: "ecom-video-item-video-url-rpc-missing-ray"
executor_type: "ray"
ray_address: "auto"
min_common_dep_num_to_combine: 0

notification_hooks:
  - type: "adc_lark_message"
    enabled: true
    interval: "5min"
    on_success: true
    on_failure: true
    fail_on_error: false
    ctx:
      userAccount: "guohongyu.7"
      apiBase: "https://ai-data-center.bytedance.net/api"
    template_id: "AAqtelosmXDl1"
    custom_fields:
      biz: "ecom_video_item_video_url_rpc_missing"
      output_url: "hdfs://haruna/ad_base/addrd_core/addrd_stats/hdfs/ccu/ecom_video_douyin_aweme/_add_vid_video_url_rpc_missing"
    custom_stats:
      - key: "rpc.video_url_rpc_mapper.total_count"
        label: "VideoArch RPC 调用总次数"
      - key: "rpc.video_url_rpc_mapper.success_count"
        label: "VideoArch RPC 成功次数"
      - key: "rpc.video_url_rpc_mapper.failed_count"
        label: "VideoArch RPC 失败次数"
      - key: "rpc.video_url_rpc_mapper.failure_rate"
        label: "VideoArch RPC 失败率"
        type: "ratio"
        numerator: "rpc.video_url_rpc_mapper.failed_count"
        denominator: "rpc.video_url_rpc_mapper.total_count"

dataset:
  configs:
    - type: remote
      source: hdfs
      path: "hdfs://haruna/home/byte_life_gen_ai/user/wangqianle/ecom_raw/video_douyin_aweme/20260208_add_vid"
      format: "parquet"
      override_num_blocks: 4096
      skip_zero_row_group_files: true

process:
  - json_object_mapper:
      batch_size: 200
      num_proc: 1024
      num_cpus: 1
      output_key: "extra"
      include_all: true
      exclude_keys:
        - "date"
  - field_assign_mapper:
      batch_size: 200
      num_proc: 1024
      num_cpus: 1
      assignments:
        id: {template: "item_id-{item_id}", type: "string"}
        source: {value: "ecom_video_raw_data", type: "string"}
        type: {value: "video", type: "string"}
        urls: {value: [], type: "list<string>"}
        video_url_rpc_condition_matched: {value: false, type: "bool"}
        video_url_rpc_request_eligible: {value: false, type: "bool"}
        video_url_rpc_output_url_count: {value: 0, type: "int64"}
        video_url_rpc_missing_result: {value: false, type: "bool"}
        video_url_rpc_missing_reason: {value: "", type: "string"}
  - video_url_rpc_mapper:
      batch_size: 50
      num_proc: 1024
      num_cpus: 1
      condition: "item_duration <= 60"
      vid_key: "vid"
      output_key: "urls"
      quality_preference: "720p"
      max_vids_per_request: 20
      qps: 50000
      ak: "${VIDEOARCH_AK}"
      sk: "${VIDEOARCH_SK}"
      psm: "toutiao.videoarch.smart_player"
      cluster: "aweme"
  - python_lambda_mapper:
      batch_size: 50
      num_proc: 1024
      num_cpus: 1
      lambda_str: >
        lambda d: (
          d.update({
            'video_url_rpc_condition_matched': d.get('item_duration') is not None and d.get('item_duration') <= 60,
            'video_url_rpc_request_eligible': d.get('item_duration') is not None and d.get('item_duration') <= 60 and str(d.get('vid') or '').strip() != '',
            'video_url_rpc_output_url_count': len(d.get('urls') or []),
            'video_url_rpc_missing_result': d.get('item_duration') is not None and d.get('item_duration') <= 60 and str(d.get('vid') or '').strip() != '' and len(d.get('urls') or []) == 0,
            'video_url_rpc_missing_reason': 'empty_result_or_rpc_error' if d.get('item_duration') is not None and d.get('item_duration') <= 60 and str(d.get('vid') or '').strip() != '' and len(d.get('urls') or []) == 0 else '',
          }) or d
        )

export:
  extra_args:
    concurrency: 128
  targets:
    - target: "hdfs"
      type: "parquet"
      path: "hdfs://haruna/ad_base/addrd_core/addrd_stats/hdfs/ccu/ecom_video_douyin_aweme/_add_vid_video_url_rpc_missing"
      mode: "overwrite"
      filter_condition: "video_url_rpc_missing_result == True"
      filesystem: "pyarrow"
      extra_args:
        columns:
          - "id"
          - "item_id"
          - "vid"
          - "item_duration"
          - "urls"
          - "video_url_rpc_condition_matched"
          - "video_url_rpc_request_eligible"
          - "video_url_rpc_output_url_count"
          - "video_url_rpc_missing_result"
          - "video_url_rpc_missing_reason"
          - "extra"
          - "source"
          - "type"

# 电商视频-视频-短视频 demo
project_name: "ecom-video-item-video-short-ray-demo"
executor_type: "ray"
ray_address: "auto"
min_common_dep_num_to_combine: 0

dataset:
  configs:
    - type: remote
      source: hdfs
      path:
        - "hdfs://haruna/home/byte_life_gen_ai/user/wangqianle/ecom_raw/video_douyin_aweme/20260208_add_vid/part-00999-b82f6a0e-7a71-4705-adc5-c2b0e27c4a48-c000.snappy.parquet"
        - "hdfs://haruna/home/byte_life_gen_ai/user/wangqianle/ecom_raw/video_douyin_aweme/20260208_add_vid/part-00998-b82f6a0e-7a71-4705-adc5-c2b0e27c4a48-c000.snappy.parquet"
      format: "parquet"
      override_num_blocks: 32
      skip_zero_row_group_files: true

process:
  - general_field_filter:
      batch_size: 200
      num_proc: 8
      num_cpus: 1
      filter_condition: "item_duration <= 60"
  - json_object_mapper:
      batch_size: 200
      num_proc: 8
      num_cpus: 1
      output_key: "extra"
      include_all: true
      exclude_keys:
        - "date"
  - field_assign_mapper:
      batch_size: 200
      num_proc: 8
      num_cpus: 1
      assignments:
        id: {template: "item_id-{item_id}", type: "string"}
        source: {value: "ecom_video_raw_data", type: "string"}
        type: {value: "video", type: "string"}
        has_audio_in_video: {value: true, type: "bool"}
        texts: {value: null, type: "string"}
        audios: {value: null, type: "string"}
        images: {value: null, type: "string"}
        urls: {value: [], type: "list<string>"}
        videos: {value: [], type: "list<binary>"}
        md5: {value: null, type: "string"}
        valid_video_count: {value: 0, type: "int64"}
  - video_url_rpc_mapper:
      batch_size: 50
      num_proc: 8
      num_cpus: 1
      vid_key: "vid"
      output_key: "urls"
      quality_preference: "720p"
      max_vids_per_request: 20
      qps: 50000
      ak: "${VIDEOARCH_AK}"
      sk: "${VIDEOARCH_SK}"
      psm: "toutiao.videoarch.smart_player"
      cluster: "aweme"
  - download_file_mapper:
      batch_size: 50
      num_proc: 8
      num_cpus: 1
      download_field: "urls"
      save_field: "videos"
      timeout: 2
      retry_times: 3
      max_concurrent: 1
      filter_non_url: true
      resume_download: true
  - bytes_exact_dedup_mapper:
      batch_size: 50
      num_proc: 8
      num_cpus: 1
      url_key: "urls"
      bytes_key: "videos"
      md5_key: "md5"
      valid_count_key: "valid_video_count"
  - ray_field_dedup_pipeline:
      batch_size: 50
      num_proc: 8
      num_cpus: 1
      condition: "valid_video_count > 0"
      field_key: "md5"
      id_key: "id"
      dedup_set_num: 16
      actor_get_timeout: 600
      actor_get_retry_times: 2
  - stateless_field_filter:
      batch_size: 50
      num_proc: 8
      num_cpus: 1
      filter_condition: "valid_video_count > 0"

export:
  target: "hdfs"
  type: "parquet"
  path: "hdfs://haruna/ad_base/addrd_core/addrd_stats/test/hdfs/ccu/video_douyin_aweme/_add_vid_video_partitioned/video_duration_group=short"
  mode: "overwrite"
  filesystem: "pyarrow"
  schema:
    fields:
      - {name: "id", type: "string"}
      - {name: "urls", type: "list<string>"}
      - {name: "videos", type: "list<binary>"}
      - {name: "md5", type: "string"}
      - {name: "extra", type: "string"}
      - {name: "source", type: "string"}
      - {name: "texts", type: "string"}
      - {name: "audios", type: "string"}
      - {name: "images", type: "string"}
      - {name: "has_audio_in_video", type: "bool"}
      - {name: "type", type: "string"}
  extra_args:
    concurrency: 1
    avoid_write_fusion: true

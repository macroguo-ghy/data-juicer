# 电商视频-视频
project_name: "ecom-video-item-video-ray"
executor_type: "ray"
ray_address: "auto"
min_common_dep_num_to_combine: 0

dataset:
  configs:
    - type: remote
      source: hdfs
      path: "hdfs://haruna/ad_base/addrd_core/addrd_stats/lance/ai_data_forge.catalog/ccu/ecom_video_item_sample_stats_daily_v2/_add_vid"
      format: "parquet"
      override_num_blocks: 800
      skip_zero_row_group_files: true

process:
  - json_object_mapper:
      output_key: "extra"
      include_all: true
      exclude_keys:
        - "date"
        - "__dj__stats__"
        - "__dj__source_file__"
  - field_assign_mapper:
      assignments:
        id: {template: "item_id-{item_id}", type: "string"}
        source: {value: "ecom_video_raw_data", type: "string"}
        type: {value: "video", type: "string"}
        has_audio_in_video: {value: true, type: "bool"}
        texts: {value: null, type: "string"}
        audios: {value: null, type: "string"}
        images: {value: null, type: "string"}
        urls: {value: [], type: "list<string>"}
        videos: {value: [], type: "list<binary>"}
        md5: {value: null, type: "string"}
        valid_video_count: {value: 0, type: "int64"}
  - video_url_rpc_mapper:
      condition: "item_duration <= 60"
      vid_key: "vid"
      output_key: "urls"
      quality_preference: "720p"
      ak: "${VIDEOARCH_AK}"
      sk: "${VIDEOARCH_SK}"
      psm: "toutiao.videoarch.smart_player"
      cluster: "aweme"
  - download_file_mapper:
      download_field: "urls"
      save_field: "videos"
      timeout: 2
      retry_times: 3
      max_concurrent: 10
      filter_non_url: true
      resume_download: true
  - bytes_exact_dedup_mapper:
      condition: "item_duration <= 60"
      url_key: "urls"
      bytes_key: "videos"
      md5_key: "md5"
      valid_count_key: "valid_video_count"
  - field_drop_mapper:
      fields:
        - "videos"
  - ray_field_dedup_pipeline:
      condition: "item_duration <= 60 and valid_video_count > 0"
      field_key: "md5"
      id_key: "id"
  - download_file_mapper:
      download_field: "urls"
      save_field: "videos"
      timeout: 2
      retry_times: 3
      max_concurrent: 10
      filter_non_url: true
      resume_download: true
  - bytes_exact_dedup_mapper:
      condition: "item_duration <= 60"
      url_key: "urls"
      bytes_key: "videos"
      md5_key: "md5"
      valid_count_key: "valid_video_count"

export:
  targets:
    - target: "hdfs"
      type: "parquet"
      path: "hdfs://haruna/ad_base/addrd_core/addrd_stats/lance/ai_data_forge.catalog/ccu/ecom_video_item_sample_stats_daily_v2/_add_vid_full_video_short_dedup"
      mode: "overwrite"
      filter_condition: "item_duration <= 60 and valid_video_count > 0"
      filesystem: "pyarrow"
      extra_args:
        columns:
          - "id"
          - "urls"
          - "videos"
          - "md5"
          - "extra"
          - "source"
          - "texts"
          - "audios"
          - "images"
          - "has_audio_in_video"
          - "type"
    - target: "hdfs"
      type: "parquet"
      path: "hdfs://haruna/ad_base/addrd_core/addrd_stats/lance/ai_data_forge.catalog/ccu/ecom_video_item_sample_stats_daily_v2/_add_vid_video_long"
      mode: "overwrite"
      filter_condition: "item_duration > 60"
      filesystem: "pyarrow"
      extra_args:
        columns:
          - "id"
          - "urls"
          - "videos"
          - "md5"
          - "extra"
          - "source"
          - "texts"
          - "audios"
          - "images"
          - "has_audio_in_video"
          - "type"

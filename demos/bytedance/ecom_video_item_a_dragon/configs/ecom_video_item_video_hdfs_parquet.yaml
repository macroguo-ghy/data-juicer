# 电商视频-视频
project_name: "ecom-video-item-video-ray"
executor_type: "ray"
ray_address: "auto"
min_common_dep_num_to_combine: 0

notification_hooks:
  - type: "adc_lark_message"
    enabled: true
    interval: "5min"
    on_success: true
    on_failure: true
    fail_on_error: false
    ctx:
      userAccount: "guohongyu.7"
      apiBase: "https://ai-data-center.bytedance.net/api"
    template_id: "AAqtelosmXDl1"
    custom_fields:
      biz: "ecom_video_item_video"
      output_url: "hdfs://haruna/ad_base/addrd_core/addrd_stats/hdfs/ccu/ecom_video_douyin_aweme/_add_vid_video_partitioned"
      short_output_path: "hdfs://haruna/ad_base/addrd_core/addrd_stats/hdfs/ccu/ecom_video_douyin_aweme/_add_vid_video_partitioned/video_duration_group=short"
      long_output_path: "hdfs://haruna/ad_base/addrd_core/addrd_stats/hdfs/ccu/ecom_video_douyin_aweme/_add_vid_video_partitioned/video_duration_group=long"
    custom_stats:
      - key: "dedup.eligible_rows"
        label: "短视频去重候选行数"
      - key: "dedup.unique_rows"
        label: "短视频去重保留行数"
      - key: "dedup.duplicate_rows"
        label: "短视频 dedup 过滤数量"
      - key: "rpc.video_url_rpc_mapper.total_count"
        label: "VideoArch RPC 调用总次数"
      - key: "rpc.video_url_rpc_mapper.success_count"
        label: "VideoArch RPC 成功次数"
      - key: "rpc.video_url_rpc_mapper.failed_count"
        label: "VideoArch RPC 失败次数"
      - key: "rpc.video_url_rpc_mapper.failure_rate"
        label: "VideoArch RPC 失败率"
        type: "ratio"
        numerator: "rpc.video_url_rpc_mapper.failed_count"
        denominator: "rpc.video_url_rpc_mapper.total_count"
      - key: "download.download_file_mapper.total_count"
        label: "视频下载总次数"
      - key: "download.download_file_mapper.success_count"
        label: "视频下载成功次数"
      - key: "download.download_file_mapper.failed_count"
        label: "视频下载失败次数"
      - key: "download.download_file_mapper.failure_rate"
        label: "视频下载失败率"
        type: "ratio"
        numerator: "download.download_file_mapper.failed_count"
        denominator: "download.download_file_mapper.total_count"

dataset:
  configs:
    - type: remote
      source: hdfs
      path: "hdfs://haruna/home/byte_life_gen_ai/user/wangqianle/ecom_raw/video_douyin_aweme/20260208_add_vid"
      format: "parquet"
      override_num_blocks: 2048
      concurrency: 512
      num_cpus: 0.5
      skip_zero_row_group_files: true

process:
  - json_object_mapper:
      batch_size: 200
      num_proc: 512
      num_cpus: 1
      output_key: "extra"
      include_all: true
      exclude_keys:
        - "date"
  - field_assign_mapper:
      batch_size: 200
      num_proc: 512
      num_cpus: 1
      assignments:
        id: {template: "item_id-{item_id}", type: "string"}
        source: {value: "ecom_video_raw_data", type: "string"}
        type: {value: "video", type: "string"}
        has_audio_in_video: {value: true, type: "bool"}
        texts: {value: null, type: "string"}
        audios: {value: null, type: "string"}
        images: {value: null, type: "string"}
        urls: {value: [], type: "list<string>"}
        videos: {value: [], type: "list<binary>"}
        md5: {value: null, type: "string"}
        valid_video_count: {value: 0, type: "int64"}
  - video_url_rpc_mapper:
      batch_size: 50
      num_proc: 512
      num_cpus: 1
      condition: "item_duration <= 60"
      vid_key: "vid"
      output_key: "urls"
      quality_preference: "720p"
      max_vids_per_request: 20
      qps: 50000
      ak: "${VIDEOARCH_AK}"
      sk: "${VIDEOARCH_SK}"
      psm: "toutiao.videoarch.smart_player"
      cluster: "aweme"
  - download_file_mapper:
      batch_size: 50
      num_proc: 512
      num_cpus: 1
      download_field: "urls"
      save_field: "videos"
      timeout: 2
      retry_times: 3
      max_concurrent: 1
      filter_non_url: true
      resume_download: true
  - bytes_exact_dedup_mapper:
      batch_size: 50
      num_proc: 512
      num_cpus: 1
      condition: "item_duration <= 60"
      url_key: "urls"
      bytes_key: "videos"
      md5_key: "md5"
      valid_count_key: "valid_video_count"
  - ray_field_dedup_pipeline:
      batch_size: 50
      num_proc: 512
      num_cpus: 1
      condition: "item_duration <= 60 and valid_video_count > 0"
      field_key: "md5"
      id_key: "id"
      dedup_set_num: 64
      actor_get_timeout: 600
      actor_get_retry_times: 2
  - general_field_filter:
      batch_size: 50
      num_proc: 512
      num_cpus: 1
      filter_condition: "item_duration > 60 or (item_duration <= 60 and valid_video_count > 0)"
  - python_lambda_mapper:
      batch_size: 50
      num_proc: 512
      num_cpus: 1
      lambda_str: "lambda d: (d.update({'video_duration_group': 'short' if (d.get('item_duration') is not None and d.get('item_duration') <= 60) else 'long'}) or d)"

export:
  target: "hdfs"
  type: "parquet"
  path: "hdfs://haruna/ad_base/addrd_core/addrd_stats/hdfs/ccu/ecom_video_douyin_aweme/_add_vid_video_partitioned"
  mode: "overwrite"
  filesystem: "pyarrow"
  schema:
    fields:
      - {name: "id", type: "string"}
      - {name: "urls", type: "list<string>"}
      - {name: "videos", type: "list<binary>"}
      - {name: "md5", type: "string"}
      - {name: "extra", type: "string"}
      - {name: "source", type: "string"}
      - {name: "texts", type: "string"}
      - {name: "audios", type: "string"}
      - {name: "images", type: "string"}
      - {name: "has_audio_in_video", type: "bool"}
      - {name: "type", type: "string"}
      - {name: "video_duration_group", type: "string"}
  extra_args:
    concurrency: 64
    min_rows_per_file: 25
    max_rows_per_file: 50
    partition_cols:
      - "video_duration_group"

# 电商视频-视频
project_name: "ecom-video-item-video-ray"
executor_type: "ray"
ray_address: "auto"
min_common_dep_num_to_combine: 0

notification_hooks:
  - type: "adc_lark_message"
    enabled: true
    interval: "5min"
    on_success: true
    on_failure: true
    fail_on_error: false
    ctx:
      userAccount: "guohongyu.7"
      apiBase: "https://ai-data-center.bytedance.net/api"
    template_id: "AAqtelosmXDl1"
    custom_fields:
      biz: "ecom_video_item_video"
      output_url: "hdfs://haruna/ad_base/addrd_core/addrd_stats/hdfs/ccu/ecom_video_douyin_aweme"
      short_output_path: "hdfs://haruna/ad_base/addrd_core/addrd_stats/hdfs/ccu/ecom_video_douyin_aweme/_add_vid_video_short_dedup"
      long_output_path: "hdfs://haruna/ad_base/addrd_core/addrd_stats/hdfs/ccu/ecom_video_douyin_aweme/_add_vid_video_long"
    custom_stats:
      - key: "dedup.eligible_rows"
        label: "短视频去重候选行数"
      - key: "dedup.unique_rows"
        label: "短视频去重保留行数"
      - key: "dedup.duplicate_rows"
        label: "短视频 dedup 过滤数量"

dataset:
  configs:
    - type: remote
      source: hdfs
      path: "hdfs://haruna/home/byte_life_gen_ai/user/wangqianle/ecom_raw/video_douyin_aweme/20260208_add_vid"
      format: "parquet"
      override_num_blocks: 4096
      skip_zero_row_group_files: true

process:
  - json_object_mapper:
      batch_size: 200
      num_proc: 1024
      num_cpus: 1
      output_key: "extra"
      include_all: true
      exclude_keys:
        - "date"
  - field_assign_mapper:
      batch_size: 200
      num_proc: 1024
      num_cpus: 1
      assignments:
        id: {template: "item_id-{item_id}", type: "string"}
        source: {value: "ecom_video_raw_data", type: "string"}
        type: {value: "video", type: "string"}
        has_audio_in_video: {value: true, type: "bool"}
        texts: {value: null, type: "string"}
        audios: {value: null, type: "string"}
        images: {value: null, type: "string"}
        urls: {value: [], type: "list<string>"}
        videos: {value: [], type: "list<binary>"}
        md5: {value: null, type: "string"}
        valid_video_count: {value: 0, type: "int64"}
  - video_url_rpc_mapper:
      batch_size: 50
      num_proc: 1024
      num_cpus: 1
      condition: "item_duration <= 60"
      vid_key: "vid"
      output_key: "urls"
      quality_preference: "720p"
      max_vids_per_request: 20
      qps: 50000
      ak: "${VIDEOARCH_AK}"
      sk: "${VIDEOARCH_SK}"
      psm: "toutiao.videoarch.smart_player"
      cluster: "aweme"
  - download_file_mapper:
      batch_size: 50
      num_proc: 1024
      num_cpus: 1
      download_field: "urls"
      save_field: "videos"
      timeout: 2
      retry_times: 3
      max_concurrent: 1
      filter_non_url: true
      resume_download: true
  - bytes_exact_dedup_mapper:
      batch_size: 50
      num_proc: 1024
      num_cpus: 1
      condition: "item_duration <= 60"
      url_key: "urls"
      bytes_key: "videos"
      md5_key: "md5"
      valid_count_key: "valid_video_count"
  - ray_field_dedup_pipeline:
      batch_size: 50
      num_proc: 1024
      num_cpus: 1
      condition: "item_duration <= 60 and valid_video_count > 0"
      field_key: "md5"
      id_key: "id"
      dedup_set_num: 512
      actor_get_timeout: 600
      actor_get_retry_times: 2

export:
  extra_args:
    concurrency: 1
  targets:
    - target: "hdfs"
      type: "parquet"
      path: "hdfs://haruna/ad_base/addrd_core/addrd_stats/hdfs/ccu/ecom_video_douyin_aweme/_add_vid_video_short_dedup"
      mode: "overwrite"
      filter_condition: "item_duration <= 60 and valid_video_count > 0"
      filesystem: "pyarrow"
      compact: false
      extra_args:
        columns:
          - "id"
          - "urls"
          - "videos"
          - "md5"
          - "extra"
          - "source"
          - "texts"
          - "audios"
          - "images"
          - "has_audio_in_video"
          - "type"
    - target: "hdfs"
      type: "parquet"
      path: "hdfs://haruna/ad_base/addrd_core/addrd_stats/hdfs/ccu/ecom_video_douyin_aweme/_add_vid_video_long"
      mode: "overwrite"
      filter_condition: "item_duration > 60"
      filesystem: "pyarrow"
      extra_args:
        columns:
          - "id"
          - "urls"
          - "videos"
          - "md5"
          - "extra"
          - "source"
          - "texts"
          - "audios"
          - "images"
          - "has_audio_in_video"
          - "type"

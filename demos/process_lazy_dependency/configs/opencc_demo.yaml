project_name: "process-lazy-dependency-demo"
np: 1
executor_type: "ray"
ray_address: "auto"
min_common_dep_num_to_combine: 0
work_dir: "./outputs/process_lazy_dependency"

# Source table:
# ghy_test.default.lance_format
# Columns: id(long), name(string), score(double)
dataset:
  configs:
    - type: remote
      source: magnus
      table_name: "ghy_test.default.lance_format"
      magnus_conf: {}

# Target table:
# ghy_test.default.lance_format_output3
# Columns: id(long), name(string), score(double), processed_by(string)
export:
  target: magnus
  table_name: "ghy_test.default.lance_format_output3"
  operation: "OVERWRITE"
  magnus_conf: {}

process:
  - specified_numeric_field_filter:
      field_key: "score"
      min_value: 85.0
      max_value: 100.0
  - python_lambda_mapper:
      lambda_str: 'lambda sample: {**sample, "processed_by": "数据处理依赖测试"}'
  - chinese_convert_mapper:
      text_key: "processed_by"
      mode: "s2t"
